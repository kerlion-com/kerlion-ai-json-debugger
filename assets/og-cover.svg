<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">KERLION AI JSON Debugger</title>
<desc id="desc">A browser-based developer tool for extracting, diagnosing, and validating AI-generated JSON.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111d"/><stop offset="1" stop-color="#063f32"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#18a879" stop-opacity=".35"/><stop offset="1" stop-color="#18a879" stop-opacity="0"/></radialGradient>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#55d9a2"/><stop offset="1" stop-color="#0d936d"/></linearGradient>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#9ce4c5" stroke-opacity=".07"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .sans{font-family:Inter,Arial,sans-serif}
    .mono{font-family:Consolas,monospace}
  </style>
</defs>
<rect width="1280" height="640" fill="url(#bg)"/>
<rect width="1280" height="640" fill="url(#glow)"/>
<rect width="1280" height="640" fill="url(#grid)"/>
<rect x="55" y="55" width="1170" height="530" rx="30" fill="none" stroke="#6bd9ad" stroke-opacity=".28" stroke-width="2"/>
<circle cx="1010" cy="290" r="250" fill="#12a777" opacity=".11" filter="url(#shadow)"/>
<g class="sans">
  <rect x="110" y="112" width="280" height="46" rx="23" fill="#154439" stroke="#5fd6a4" stroke-opacity=".7"/>
  <circle cx="136" cy="135" r="6" fill="#64dca8"/>
  <text x="156" y="141" fill="#e1f6eb" font-size="16" font-weight="700" letter-spacing=".8">KERLION  |  DEVELOPER TOOLS</text>
  <text x="105" y="260" fill="#f4f8fc" font-size="55" font-weight="800" letter-spacing="1">AI JSON DEBUGGER</text>
  <rect x="108" y="285" width="302" height="6" rx="3" fill="url(#accent)"/>
  <text x="108" y="352" fill="#d2e7df" font-size="26">Inspect and validate AI-generated JSON</text>
  <text x="108" y="388" fill="#83d9b4" font-size="18">Extract  •  Diagnose  •  JSON Schema  •  Batch Test</text>
  <text x="108" y="535" fill="#9dbbad" font-size="17">A practical browser-based tool for developers</text>
  <text x="108" y="570" fill="#67dda9" font-size="18" font-weight="700">www.kerlionvip.com</text>
</g>
<!-- Stylized KERLION mark, recreated as a clean geometric emblem -->
<g transform="translate(1008 292)">
  <circle r="169" fill="#071a1d" stroke="#55d9a2" stroke-width="4"/>
  <circle r="157" fill="#0c3028" stroke="#d9e6df" stroke-width="2"/>
  <circle r="146" fill="none" stroke="#65d8a6" stroke-opacity=".6" stroke-width="2"/>
  <g fill="none" stroke="#d9e7df" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-84-73 Q-105-112-82-137 Q-74-108-52-98 Q-56-130-31-150 Q-25-119-5-107 Q0-143 18-159 Q22-122 47-106 Q64-128 87-136 Q82-100 63-80"/>
    <path d="M-89-55 Q-112-16-96 37 Q-80 93-35 109 Q0 122 35 109 Q80 93 96 37 Q112-16 89-55"/>
    <path d="M-68-42 Q-43-72-15-54 Q-2-44 0-30 Q2-44 15-54 Q43-72 68-42"/>
    <path d="M-58 3 Q-34-16-12 0 Q0 10 12 0 Q34-16 58 3"/>
    <path d="M-25 38 Q0 51 25 38 M-14 59 Q0 66 14 59"/>
    <path d="M-105-23 Q-129-4-124 28 M105-23 Q129-4 124 28"/>
  </g>
  <g fill="#e5eee8">
    <ellipse cx="-39" cy="-30" rx="9" ry="13"/><ellipse cx="39" cy="-30" rx="9" ry="13"/>
  </g>
  <g fill="none" stroke="#d9e7df" stroke-width="4">
    <path d="M-73 132 Q-34 113 0 139 Q34 113 73 132 L58 158 H-58Z"/>
    <path d="M-45-169 Q-30-202 0-220 Q30-202 45-169Z"/>
    <path d="M-68-169 H68 M-49-183 H49"/>
  </g>
  <text x="0" y="155" class="sans" text-anchor="middle" fill="#f0f7f2" font-size="31" font-weight="800">K</text>
</g>
<!-- Developer output panel -->
<g transform="translate(760 420)">
  <rect width="440" height="200" rx="18" fill="#08111c" fill-opacity=".96" stroke="#63c99e" stroke-opacity=".55" stroke-width="2"/>
  <path d="M18 0H422a18 18 0 0 1 18 18v20H0V18A18 18 0 0 1 18 0Z" fill="#162c35"/>
  <circle cx="23" cy="19" r="5.5" fill="#ff7777"/><circle cx="43" cy="19" r="5.5" fill="#ffc45f"/><circle cx="63" cy="19" r="5.5" fill="#69d89e"/>
  <text x="97" y="24" class="sans" font-size="13" fill="#b6ccc3">structured-output.json</text>
  <g class="mono" font-size="17">
    <text x="26" y="75" fill="#67dba5">{</text>
    <text x="42" y="102" fill="#e1eee8">"status": "valid",</text>
    <text x="42" y="129" fill="#e1eee8">"source": "AI model",</text>
    <text x="42" y="156" fill="#e1eee8">"schema": "passed"</text>
    <text x="26" y="183" fill="#67dba5">}</text>
  </g>
</g>
</svg>