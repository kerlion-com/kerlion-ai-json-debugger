name: Build Release Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source
        run: |
          node --check app.js
          node tests.js

      - name: Create release ZIP
        run: |
          ARCHIVE="KERLION-AI-JSON-Debugger-${GITHUB_REF_NAME}.zip"
          zip -r "$ARCHIVE" index.html styles.css app.js README.md LICENSE tests.js assets
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Attach package to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "$ARCHIVE" --clobber
