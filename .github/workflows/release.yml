name: Build Release Package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate source
        run: |
          node --check app.js
          node tests.js

      - name: Create release ZIP
        run: |
          zip -r KERLION-AI-JSON-Debugger-${GITHUB_REF_NAME}.zip \
            index.html styles.css app.js README.md LICENSE assets

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: KERLION-AI-JSON-Debugger-${GITHUB_REF_NAME}
          path: KERLION-AI-JSON-Debugger-${GITHUB_REF_NAME}.zip
          if-no-files-found: error
          retention-days: 30
